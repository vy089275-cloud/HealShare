name: HealShare CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend-test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d healshare"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: healshare-backend
        env:
          DB_PASSWORD: postgres
        run: >
          ./mvnw clean test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/healshare
          -Dspring.datasource.username=postgres
          -Dspring.datasource.password=postgres
          -Dspring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

  frontend-build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: healshare-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: healshare-frontend
        run: npm ci

      - name: Build frontend
        working-directory: healshare-frontend
        run: npm run build